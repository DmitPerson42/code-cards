[package]
name = "code-cards"
version = "0.1.0"
description = "Code Cards - локальная библиотека фрагментов кода с разбором по строкам"
authors = ["Code Cards"]
edition = "2021"
rust-version = "1.90"
# В каталоге два бинарника: окно приложения (src/main.rs) и консольный
# code-cards-cli для работы с базой. Без default-run сборка установщика
# падает: "failed to find main binary".
default-run = "code-cards"

[lib]
name = "code_cards_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
similar = "2"
chrono = "0.4"

[profile.dev]
# Отладочная информация выключена для всего профиля сборки.
#
# Причина: cc-rs собирает sqlite3.c из rusqlite с флагом -Z7 (полный debuginfo).
# Компилятор MSVC 14.51 не справляется с этим и падает с D8050
# ("не удалось поместить командную строку в запись отладки") на файле c1.dll.
# Параметр debug = "line-tables-only" НЕ помогает: для C-файлов он всё равно
# даёт -Z7. Работает только полное выключение debuginfo для профиля dev.
# Баги ищем тестами, отладчик для этого проекта не нужен.
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
